<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>week3-tailwind</title>
  </head>
  <body>
    <!-- HERO BANNER -->
    <nav>
      <!-- HERO BANNER -->
      <header class="bg-slate-900 py-20 md:py-28">
         <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
        <!-- Badge -->
           <span class="inline-block py-1 px-3 rounded-full bg-blue-900/50 text-blue-200 text-sm font-semibold tracking-wider mb-6 border border-blue-700/50">
           LATEST INSIGHTS
          </span>
        
            <!-- Heading -->
          <h1 class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-white tracking-tight mb-6">
            Empowering the <span class="text-blue-500">Digital Ministry</span>
           </h1>
        
            <!-- Tagline -->
          <p class="mt-4 max-w-2xl mx-auto text-lg md:text-xl text-slate-400 mb-10">
             Discover digital ministry strategies, live-streaming setups for your sanctuary, and virtual discipleship tools to extend your congregation's fellowship and share the gospel across the globe.
          </p>
        
           <!-- Call-to-Action Button -->
          <a href="#articles" class="inline-flex items-center justify-center px-8 py-3.5 border border-transparent text-base font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-500 transition-colors shadow-lg hover:shadow-blue-500/25">
            Read Articles
          <!-- Small arrow SVG inside the button -->
          <svg class="ml-2 -mr-1 w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
          </svg>
           </a>
        </div>
      </header>
    </nav>  
    <div id="app"></div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
